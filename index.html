<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Random Password Generator | Create Random Passwords</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Avast CSS-->
    <link rel="stylesheet" href="https://www.avast.com/etc.clientlibs/avast/clientlibs/generated/components/randompasswordgenerator.lc-4112767010f2ccdaf5af0faceafc009d-lc.min.css" type="text/css">
    <link rel="stylesheet" href="css/avast.css" type="text/css">
</head>
<body>
    <header>
        <h1 id="title">Free Random Password Generator</h1>
    </header>
    <div>
        <!-- Remove this later -->
        <a href="https://www.avast.com/random-password-generator#pc" target="_blank" style="color: cornflowerblue; text-decoration: underline;">Link to password generator</a>
    </div>
    <div>
        <p>Need a secure password ideas? Generate a unique, multi-character, strong password for free.  This type of password will help protect your online accounts and stay safe.</p>
    </div>
    <div class="c-pwd-gen" id="randompasswordgenerator-ec93b6dceb" data-score="very-strong">
        <div class="c-pwd-gen__container">
            <div class="c-pwd-gen__illustrations">
                <img class="c-pwd-gen__illustrations-image c-pwd-gen--very-weak" loading="eager" src="https://www.avast.com/content/dam/avast/illustrations/bait/Password-Generator-1.svg" alt="">
                <img class="c-pwd-gen__illustrations-image c-pwd-gen--weak" loading="eager" src="https://www.avast.com/content/dam/avast/illustrations/bait/Password-Generator-2.svg" alt="">
                <img class="c-pwd-gen__illustrations-image c-pwd-gen--good" loading="eager" src="https://www.avast.com/content/dam/avast/illustrations/bait/Password-Generator-3.svg" alt="">
                <img class="c-pwd-gen__illustrations-image c-pwd-gen--strong" loading="eager" src="https://www.avast.com/content/dam/avast/illustrations/bait/Password-Generator-4.svg" alt="">
                <img class="c-pwd-gen__illustrations-image c-pwd-gen--very-strong" loading="eager" src="https://www.avast.com/content/dam/avast/illustrations/bait/Password-Generator-5.svg" alt="">
            </div>
            <div class="c-pwd-gen__main-fields">
                <div class="c-pwd-gen__pass-generator">
                    <div class="c-pwd-gen__input-container">
                        <div class="c-pwd-gen__input-wrapper">
                            <div class="c-pwd-gen__form-control-wrapper">
                                <input type="text" class="c-pwd-gen__password-generated" id="password" placeholder="Generated password goes here!">
                                <div class="c-pwd-gen__label-refresh">
                                    <label class="c-pwd-gen__label c-pwd-gen--very-weak t-bg--red">Very weak</label>
                                    <label class="c-pwd-gen__label c-pwd-gen--weak t-bg--light-orange">Weak</label>
                                    <label class="c-pwd-gen__label c-pwd-gen--good t-bg--pale-orange">Good</label>
                                    <label class="c-pwd-gen__label c-pwd-gen--strong t-bg--pale-green">Strong</label>
                                    <label class="c-pwd-gen__label c-pwd-gen--very-strong t-bg--bright-green">Very strong</label>
                                </div>
                                <button class="c-pwd-gen__icon-refresh" id="refreshBtn"></button>
                            </div>
                        </div>
                        <div class="c-pwd-gen__copy-btn">
                            <div class="c-button c-btn--medium c-btn--blue">
                                <a class="c-btn" id="copyBtn" href="#">
                                    <span id="copy">Copy</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="c-pwd-gen__settings">
                    <div class="c-pwd-gen__length-settings">
                        <div class="c-pwd-gen__length-count">
                            <label class="c-pwd-gen__length-label body2">
                                <span>Password length</span>:
                                <span class="c-pwd-gen__length-value" id="length">20</span>
                            </label>
                        </div>
                        <div class="c-pwd-gen__slider-settings">
                            <button class="c-pwd-gen__slider-settings-btn c-pwd-gen--decrement" data-value-change="-1">
                                <span class="c-pwd-gen__minus"></span>
                            </button>
                            <div class="c-pwd-gen__slider-container">
                                <input type="range" min="1" max="50" value="20" class="c-pwd-gen__slider" style="background: linear-gradient(to right, rgb(0, 112, 246) 0%, rgb(0, 112, 246) 78%, rgb(255, 255, 255) 78%, white 100%);">
                            </div>
                            <button class="c-pwd-gen__slider-settings-btn c-pwd-gen--increment" data-value-change="1">
                                <span class="c-pwd-gen__plus"></span>
                            </button>
                        </div>
                    </div>
                    <div class="c-pwd-gen__complexity-settings">
                        <label class="body2 c-pwd-gen__complexity-label">
                            <span>Characters used</span>:
                        </label>
                        <div class="c-pwd-gen__complexity-checkbox">
                            <div class="c-pwd-gen__checkbox-wrapper">
                                <input type="checkbox" id="uppercase" class="c-pwd-gen__custom-control-input c-pwd-gen__uppercase" value="A" checked="">
                                <label for="uppercase" class="c-pwd-gen__custom-control-label body2">ABC</label>
                            </div>
                            <div class="c-pwd-gen__checkbox-wrapper">
                                <input id="lowercase" type="checkbox" class="c-pwd-gen__custom-control-input c-pwd-gen__lowercase" value="a" checked="">
                                <label for="lowercase" class="c-pwd-gen__custom-control-label body2">abc</label>
                            </div>
                            <div class="c-pwd-gen__checkbox-wrapper">
                                <input id="numbers" type="checkbox" class="c-pwd-gen__custom-control-input c-pwd-gen__numbers" value="0" checked="">
                                <label for="numbers" class="c-pwd-gen__custom-control-label body2">123</label>
                            </div>
                            <div class="c-pwd-gen__checkbox-wrapper">
                                <input id="specials" type="checkbox" class="c-pwd-gen__custom-control-input c-pwd-gen__specials" value="!">
                                <label for="specials" class="c-pwd-gen__custom-control-label body2">#$&amp;</label>
                            </div>
                        </div>
                    </div>
                    <div class="c-pwd-gen__complexity-settings">
                        <label class="body2 c-pwd-gen__complexity-label">
                            <span>Extra settings</span>:
                        </label>
                        <div class="c-pwd-gen__complexity-checkbox">
                            <div class="c-pwd-gen__checkbox-wrapper">
                                <input type="checkbox" id="ambiguous" class="c-pwd-gen__custom-control-input c-pwd-gen__ambiguous" value="0">
                                <label for="ambiguous" class="c-pwd-gen__custom-control-label body2">Avoid ambiguous (l, I, 1, 0, O, |)</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/logic.js"></script>
</body>
</html>
